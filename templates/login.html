<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign In | Student Attendance</title>
    <style>
        :root {
            --primary: #2563eb;
            --primary-dark: #1d4ed8;
            --text: #0f172a;
            --muted: #64748b;
            --border: #cbd5e1;
            --bg-input: #f8fafc;
            --error-bg: #fef2f2;
            --error-text: #b91c1c;
            --error-border: #fecaca;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 24px;
            background: linear-gradient(135deg, #1e3a8a 0%, #2563eb 50%, #38bdf8 100%);
            color: var(--text);
        }

        .login-card {
            width: 100%;
            max-width: 400px;
            background: #fff;
            padding: 40px 36px;
            border-radius: 16px;
            box-shadow: 0 20px 45px rgba(15, 23, 42, 0.25);
        }

        .brand {
            text-align: center;
            margin-bottom: 28px;
        }

        .brand-icon {
            width: 56px;
            height: 56px;
            margin: 0 auto 16px;
            border-radius: 14px;
            background: linear-gradient(135deg, var(--primary), #38bdf8);
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .brand-icon svg { width: 28px; height: 28px; stroke: #fff; }

        .brand h1 { font-size: 22px; font-weight: 700; letter-spacing: -0.2px; }
        .brand p { margin-top: 6px; font-size: 14px; color: var(--muted); }

        .error {
            display: flex;
            align-items: center;
            gap: 8px;
            background: var(--error-bg);
            color: var(--error-text);
            border: 1px solid var(--error-border);
            padding: 10px 14px;
            border-radius: 8px;
            margin-bottom: 20px;
            font-size: 14px;
        }

        .field { margin-bottom: 18px; }

        .field label {
            display: block;
            margin-bottom: 6px;
            font-size: 13px;
            font-weight: 600;
            color: #334155;
        }

        .input-wrap { position: relative; }

        .input-wrap input {
            width: 100%;
            padding: 12px 14px;
            font-size: 15px;
            color: var(--text);
            background: var(--bg-input);
            border: 1px solid var(--border);
            border-radius: 8px;
            outline: none;
            transition: border-color 0.2s, box-shadow 0.2s, background 0.2s;
        }

        .input-wrap input:focus {
            background: #fff;
            border-color: var(--primary);
            box-shadow: 0 0 0 4px rgba(37, 99, 235, 0.15);
        }

        .input-wrap input[type="password"],
        .input-wrap input.has-toggle { padding-right: 64px; }

        .toggle-pw {
            position: absolute;
            right: 10px;
            top: 50%;
            transform: translateY(-50%);
            background: none;
            border: none;
            font-size: 12px;
            font-weight: 600;
            color: var(--primary);
            cursor: pointer;
            padding: 4px 6px;
        }

        .toggle-pw:hover { color: var(--primary-dark); }

        .btn-login {
            width: 100%;
            margin-top: 6px;
            padding: 12px;
            font-size: 15px;
            font-weight: 600;
            color: #fff;
            background: var(--primary);
            border: none;
            border-radius: 8px;
            cursor: pointer;
            transition: background 0.2s, transform 0.1s, box-shadow 0.2s;
        }

        .btn-login:hover {
            background: var(--primary-dark);
            box-shadow: 0 6px 16px rgba(37, 99, 235, 0.35);
        }

        .btn-login:active { transform: translateY(1px); }

        .footer {
            margin-top: 24px;
            text-align: center;
            font-size: 12px;
            color: var(--muted);
        }

        @media (max-width: 480px) {
            .login-card { padding: 32px 24px; }
        }
    </style>
</head>
<body>
    <main class="login-card">
        <div class="brand">
            <div class="brand-icon">
                <svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                    <path d="M22 10L12 5 2 10l10 5 10-5z"/>
                    <path d="M6 12v5c3 3 9 3 12 0v-5"/>
                </svg>
            </div>
            <h1>Student Attendance</h1>
            <p>Sign in to continue to your account</p>
        </div>

        {% if error %}
        <div class="error" role="alert">
            <span>⚠</span>
            <span>{{ error }}</span>
        </div>
        {% endif %}

        <form method="POST" action="/login">
            <div class="field">
                <label for="username">Username</label>
                <div class="input-wrap">
                    <input type="text" id="username" name="username"
                           placeholder="Enter your username"
                           autocomplete="username" required autofocus>
                </div>
            </div>

            <div class="field">
                <label for="password">Password</label>
                <div class="input-wrap">
                    <input type="password" id="password" name="password"
                           placeholder="Enter your password"
                           autocomplete="current-password" required>
                    <button type="button" class="toggle-pw" id="togglePw"
                            aria-label="Show password">Show</button>
                </div>
            </div>

            <button type="submit" class="btn-login">Sign In</button>
        </form>

        <p class="footer">&copy; 2026 Student Attendance System</p>
    </main>

    <script>
        const pw = document.getElementById('password');
        const btn = document.getElementById('togglePw');
        btn.addEventListener('click', () => {
            const show = pw.type === 'password';
            pw.type = show ? 'text' : 'password';
            btn.textContent = show ? 'Hide' : 'Show';
            btn.setAttribute('aria-label', show ? 'Hide password' : 'Show password');
        });
    </script>
</body>
</html>
